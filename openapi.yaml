openapi: 3.0.4
info:
  title: ASCII85 Encoder
  description: >-
    ASCII85 Encoder encodes text into Base85 strings or decodes existing ASCII85
    payloads back to plain text. Each request returns the converted output with
    original and processed character counts, while paid plans add custom formats
    and compression ratios.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/ascii85encoder:
    get:
      summary: ASCII85 Encoder
      description: Encode text using ASCII85 (Base85) encoding
      operationId: ascii85encoder
      parameters:
        - name: text
          in: query
          schema:
            type: string
          required: true
          description: Text to encode
          example: Hello World
        - name: action
          in: query
          schema:
            type: string
          required: false
          description: Action to perform
          example: encode
        - name: format
          in: query
          schema:
            type: string
          required: false
          description: Output format
          example: standard
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  original_text: Hello World
                  encoded: 87cURD]i,"Ebo7
                  format: standard
                  original_length: 11
                  encoded_length: 14
                  compression_ratio: 127.27%
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
